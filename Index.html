<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Service Request System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-blue-900 text-white p-4 shadow-lg">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        🏛️ eCitizen Public Service Portal
      </h1>
      <div class="flex gap-2">
        <button onclick="switchView('citizen')" class="px-3 py-1 bg-blue-700 hover:bg-blue-600 rounded text-sm font-medium">Citizen Portal</button>
        <button onclick="switchView('admin')" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 rounded text-sm font-medium">Admin Dashboard</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">

    <!-- CITIZEN SECTION -->
    <section id="citizenView" class="space-y-6">
      <div class="bg-white p-6 rounded-lg shadow-md max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold mb-4 text-blue-900">Report a Public Issue</h2>
        <form id="requestForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Issue Category *</label>
            <select id="category" required class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
              <option value="">Select Category</option>
              <option value="Streetlight">Broken Streetlight</option>
              <option value="Water Issue">Water Supply / Pipe Leakage</option>
              <option value="Garbage Collection">Garbage Collection</option>
              <option value="Road Maintenance">Roads & Potholes</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Location / Ward *</label>
            <input type="text" id="location" placeholder="e.g. Ward 3, Main Street" required class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Detailed Description *</label>
            <textarea id="description" rows="3" placeholder="Describe the issue clearly..." required class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Image URL (Optional)</label>
            <input type="url" id="imageUrl" placeholder="https://example.com/photo.jpg" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded shadow transition">Submit Request</button>
        </form>
      </div>
    </section>

    <!-- ADMIN SECTION -->
    <section id="adminView" class="hidden space-y-6">
      
      <!-- Analytics Overview -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-600">
          <p class="text-sm font-semibold text-gray-500">Total Requests</p>
          <p id="statTotal" class="text-3xl font-bold text-gray-800">0</p>
        </div>
        <div class="bg-white p-5 rounded-lg shadow border-l-4 border-amber-500">
          <p class="text-sm font-semibold text-gray-500">Open / Pending Cases</p>
          <p id="statOpen" class="text-3xl font-bold text-amber-600">0</p>
        </div>
        <div class="bg-white p-5 rounded-lg shadow border-l-4 border-emerald-500">
          <p class="text-sm font-semibold text-gray-500">Resolved Cases</p>
          <p id="statResolved" class="text-3xl font-bold text-emerald-600">0</p>
        </div>
      </div>

      <!-- Table Header & Filters -->
      <div class="bg-white p-4 rounded-lg shadow flex flex-col sm:flex-row justify-between items-center gap-4">
        <h3 class="text-xl font-bold text-gray-800">Manage Service Requests</h3>
        <input type="text" id="searchInput" placeholder="Search by location or category..." onkeyup="renderTable()" class="border rounded p-2 text-sm w-full sm:w-72">
      </div>

      <!-- Requests Table -->
      <div class="bg-white shadow rounded-lg overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-500 uppercase">
              <th class="p-4">Category</th>
              <th class="p-4">Location</th>
              <th class="p-4">Description</th>
              <th class="p-4">Status</th>
              <th class="p-4">Action</th>
            </tr>
          </thead>
          <tbody id="requestTableBody">
            <!-- Dynamic Data -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let requests = JSON.parse(localStorage.getItem('public_requests')) || [
      { id: 1, category: 'Streetlight', location: 'Ward 4, Kenyatta Ave', description: 'Streetlight completely off for 3 days', status: 'Pending' },
      { id: 2, category: 'Water Issue', location: 'Main Street', description: 'Pipe leaking near the market', status: 'In Progress' }
    ];

    function switchView(view) {
      if (view === 'citizen') {
        document.getElementById('citizenView').classList.remove('hidden');
        document.getElementById('adminView').classList.add('hidden');
      } else {
        document.getElementById('citizenView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        renderTable();
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newReq = {
        id: Date.now(),
        category: document.getElementById('category').value,
        location: document.getElementById('location').value,
        description: document.getElementById('description').value,
        status: 'Pending'
      };
      requests.unshift(newReq);
      localStorage.setItem('public_requests', JSON.stringify(requests));
      alert('Request submitted successfully!');
      document.getElementById('requestForm').reset();
      switchView('admin');
    }

    function updateStatus(id, newStatus) {
      requests = requests.map(r => r.id === id ? { ...r, status: newStatus } : r);
      localStorage.setItem('public_requests', JSON.stringify(requests));
      renderTable();
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const tbody = document.getElementById('requestTableBody');
      tbody.innerHTML = '';

      const filtered = requests.filter(r => 
        r.category.toLowerCase().includes(search) || r.location.toLowerCase().includes(search)
      );

      // Update Analytics
      document.getElementById('statTotal').innerText = requests.length;
      document.getElementById('statOpen').innerText = requests.filter(r => r.status !== 'Resolved').length;
      document.getElementById('statResolved').innerText = requests.filter(r => r.status === 'Resolved').length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No requests found.</td></tr>`;
        return;
      }

      filtered.forEach(req => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50 text-sm">
            <td class="p-4 font-semibold text-blue-900">${req.category}</td>
            <td class="p-4">${req.location}</td>
            <td class="p-4">${req.description}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                req.status === 'Resolved' ? 'bg-emerald-100 text-emerald-800' :
                req.status === 'In Progress' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
              }">${req.status}</span>
            </td>
            <td class="p-4">
              <select onchange="updateStatus(${req.id}, this.value)" class="border rounded p-1 text-xs bg-white">
                <option value="Pending" ${req.status==='Pending'?'selected':''}>Pending</option>
                <option value="In Progress" ${req.status==='In Progress'?'selected':''}>In Progress</option>
                <option value="Resolved" ${req.status==='Resolved'?'selected':''}>Resolved</option>
              </select>
            </td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
